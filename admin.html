<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin ♡</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --bg-color: #fff4f6;
      --card-bg: #ffffff;
      --primary-pink: #ee8399;
      --border-color: #f7d5de;
      --text-main: #4a3e3d;
      --text-muted: #968688;
      --shadow: 0 8px 24px rgba(238, 131, 153, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Quicksand', 'Mitr', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 20px 16px 80px;
    }

    .container {
      width: 100%;
      max-width: 420px;
    }

    /* LOGIN VIEW */
    #loginView {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 80vh;
    }

    .login-card {
      background: var(--card-bg);
      border-radius: 28px;
      padding: 36px 24px;
      box-shadow: var(--shadow);
      text-align: center;
    }

    .bow-icon {
      font-size: 38px;
      margin-bottom: 8px;
    }

    .login-title {
      font-size: 22px;
      color: var(--primary-pink);
      font-weight: 700;
      margin-bottom: 24px;
    }

    .form-group {
      text-align: left;
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 6px;
      padding-left: 4px;
    }

    .input-pill {
      width: 100%;
      height: 48px;
      border: 1.5px solid var(--border-color);
      border-radius: 24px;
      padding: 0 18px;
      font-size: 14px;
      color: var(--text-main);
      outline: none;
      background: #fff;
    }

    .input-pill:focus {
      border-color: var(--primary-pink);
      box-shadow: 0 0 0 3px rgba(238, 131, 153, 0.15);
    }

    .textarea-pill {
      width: 100%;
      border: 1.5px solid var(--border-color);
      border-radius: 20px;
      padding: 12px 18px;
      font-size: 14px;
      color: var(--text-main);
      outline: none;
      resize: vertical;
      background: #fff;
    }

    .textarea-pill:focus {
      border-color: var(--primary-pink);
      box-shadow: 0 0 0 3px rgba(238, 131, 153, 0.15);
    }

    .btn-pink {
      width: 100%;
      height: 48px;
      background: linear-gradient(135deg, #f29bb0, var(--primary-pink));
      color: white;
      border: none;
      border-radius: 24px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(238, 131, 153, 0.35);
      transition: all 0.2s;
      margin-top: 10px;
    }

    .btn-pink:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }

    .error-text {
      color: #ff4d6d;
      font-size: 13px;
      margin-top: 12px;
      display: none;
    }

    /* DASHBOARD VIEW */
    #dashboardView {
      display: none;
    }

    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .nav-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-main);
    }

    .logout-btn {
      background: #fbeef2;
      color: #b57a87;
      border: none;
      padding: 6px 16px;
      border-radius: 16px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .welcome-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .welcome-title {
      font-size: 24px;
      color: var(--primary-pink);
      font-weight: 700;
    }

    .welcome-sub {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .stats-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 28px;
    }

    .stat-card {
      background: var(--card-bg);
      border-radius: 24px;
      padding: 20px 14px;
      text-align: center;
      box-shadow: var(--shadow);
    }

    .stat-icon {
      font-size: 22px;
      margin-bottom: 6px;
    }

    .stat-number {
      font-size: 26px;
      font-weight: 700;
      color: var(--primary-pink);
    }

    .stat-label {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-main);
      margin-top: 2px;
    }

    .stat-desc {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .section-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .panel-card {
      background: var(--card-bg);
      border-radius: 28px;
      padding: 22px;
      box-shadow: var(--shadow);
      margin-bottom: 24px;
    }

    .panel-subtitle {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .upload-area {
      border: 1.5px dashed var(--border-color);
      border-radius: 20px;
      padding: 20px 12px;
      text-align: center;
      margin-bottom: 18px;
      background: #fffbfa;
    }

    .upload-btn {
      background: linear-gradient(135deg, #f29bb0, var(--primary-pink));
      color: #fff;
      border: none;
      padding: 8px 20px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(238, 131, 153, 0.3);
    }

    .upload-hint {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 8px;
    }

    .preview-circle {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      object-fit: cover;
      margin: 0 auto 10px;
      display: none;
      border: 2px solid var(--primary-pink);
    }

    .review-card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .review-left {
      flex: 1;
      padding-right: 10px;
    }

    .review-author {
      font-weight: 700;
      font-size: 15px;
      color: var(--text-main);
    }

    .review-stars {
      color: #ffb703;
      font-size: 13px;
      margin: 3px 0;
    }

    .review-comment {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .review-time {
      font-size: 11px;
      color: #b5a9ab;
      margin-top: 4px;
    }

    .btn-delete {
      background: #fbeef2;
      border: 1px solid var(--border-color);
      color: var(--primary-pink);
      padding: 6px 14px;
      border-radius: 14px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- LOGIN VIEW -->
    <div id="loginView">
      <div class="login-card">
        <div class="bow-icon">🎀</div>
        <h1 class="login-title">Admin Login ♡</h1>
        
        <form onsubmit="handleLogin(event)">
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="loginEmail" class="input-pill" placeholder="ancharee09605@gmail.com" required>
          </div>
          
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="loginPass" class="input-pill" placeholder="••••••••" required>
          </div>

          <button type="submit" class="btn-pink">เข้าสู่ระบบ ✨</button>
          <p id="loginError" class="error-text">อีเมลหรือรหัสผ่านไม่ถูกต้อง</p>
        </form>
      </div>
    </div>

    <!-- DASHBOARD VIEW -->
    <div id="dashboardView">
      
      <div class="top-nav">
        <div class="nav-title">Admin ♡</div>
        <button class="logout-btn" onclick="handleLogout()">Log Out</button>
      </div>

      <div class="welcome-header">
        <h2 class="welcome-title">Welcome Admin ♡</h2>
        <p class="welcome-sub">manage your reviews and website profile</p>
      </div>

      <div class="stats-row">
        <div class="stat-card">
          <div class="stat-icon">💬</div>
          <div class="stat-number" id="totalReviewsCount">0</div>
          <div class="stat-label">Total Reviews</div>
          <div class="stat-desc">Live from Cloud</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">⭐</div>
          <div class="stat-number" id="totalStarsCount">0</div>
          <div class="stat-label">Total Stars</div>
          <div class="stat-desc">All reviews</div>
        </div>
      </div>

      <div class="section-title">✏️ Change Profiles</div>

      <!-- Main Page Profile -->
      <div class="panel-card">
        <div class="panel-subtitle">🏠 Main Page Profile</div>
        
        <label style="font-size: 13px; color: var(--text-muted); margin-bottom: 6px; display: block;">Profile Picture</label>
        <div class="upload-area">
          <img id="mainImgPreview" class="preview-circle">
          <label class="upload-btn">
            📷 Choose Image
            <input type="file" accept="image/*" style="display: none;" onchange="previewImage(this, 'mainImgPreview')">
          </label>
          <div class="upload-hint">No image selected</div>
        </div>

        <div class="form-group">
          <label>Name</label>
          <input type="text" id="mainName" class="input-pill" placeholder="benefitie ♡">
        </div>

        <div class="form-group">
          <label>Bio</label>
          <textarea id="mainBio" class="textarea-pill" rows="3" placeholder="ข้อความแนะนำร้านหน้าแรก..."></textarea>
        </div>

        <button type="button" class="btn-pink" onclick="saveMainProfile()">Save Main Profile ♡</button>
      </div>

      <!-- Contact Page Profile -->
      <div class="panel-card">
        <div class="panel-subtitle">💌 Contact Page Profile</div>

        <label style="font-size: 13px; color: var(--text-muted); margin-bottom: 6px; display: block;">Profile Picture</label>
        <div class="upload-area">
          <img id="contactImgPreview" class="preview-circle">
          <label class="upload-btn">
            📷 Choose Image
            <input type="file" accept="image/*" style="display: none;" onchange="previewImage(this, 'contactImgPreview')">
          </label>
          <div class="upload-hint">No image selected</div>
        </div>

        <div class="form-group">
          <label>Name</label>
          <input type="text" id="contactName" class="input-pill" placeholder="benefitie ♡">
        </div>

        <div class="form-group">
          <label>Username</label>
          <input type="text" id="contactUsername" class="input-pill" placeholder="@benefitie">
        </div>

        <div class="form-group">
          <label>Bio</label>
          <textarea id="contactBio" class="textarea-pill" rows="3" placeholder="Contact profile bio..."></textarea>
        </div>

        <div class="form-group">
          <label>Followers</label>
          <input type="text" id="contactFollowers" class="input-pill" placeholder="888">
        </div>

        <div class="form-group">
          <label>Following</label>
          <input type="text" id="contactFollowing" class="input-pill" placeholder="127">
        </div>

        <button type="button" class="btn-pink" onclick="saveContactProfile()">Save Contact Profile ♡</button>
      </div>

      <!-- Delete Reviews -->
      <div class="section-title">🗑️ Delete Reviews</div>
      <div id="reviewsContainer"></div>

    </div>

  </div>

  <script>
    const AUTH_EMAIL = "ancharee09605@gmail.com";
    const AUTH_PASS = "4307";

    // Firebase Config ของ benefitie
    const firebaseConfig = {
      apiKey: "AIzaSyCpAGDSy1NRgmLV_g7qJrCpwOhU9MrfQyY",
      authDomain: "benefitie.firebaseapp.com",
      projectId: "benefitie",
      storageBucket: "benefitie.firebasestorage.app",
      messagingSenderId: "270365672215",
      appId: "1:270365672215:web:230d1491091e26ce83ed52",
      measurementId: "G-7JYKQP96ZE"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    window.onload = function() {
      if (sessionStorage.getItem('benefitie_admin_auth') === 'true') {
        showDashboard();
      }
    };

    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const pass = document.getElementById('loginPass').value.trim();
      const err = document.getElementById('loginError');

      if (email === AUTH_EMAIL && pass === AUTH_PASS) {
        sessionStorage.setItem('benefitie_admin_auth', 'true');
        err.style.display = 'none';
        showDashboard();
      } else {
        err.style.display = 'block';
      }
    }

    function handleLogout() {
      sessionStorage.removeItem('benefitie_admin_auth');
      document.getElementById('dashboardView').style.display = 'none';
      document.getElementById('loginView').style.display = 'flex';
    }

    function showDashboard() {
      document.getElementById('loginView').style.display = 'none';
      document.getElementById('dashboardView').style.display = 'block';
      listenToReviewsAdmin();
      loadSavedProfiles();
    }

    // ซิงก์รีวิวและสถิติจาก Cloud Firestore
    function listenToReviewsAdmin() {
      db.collection("benefitie_reviews")
        .orderBy("createdAt", "desc")
        .onSnapshot(snapshot => {
          document.getElementById('totalReviewsCount').textContent = snapshot.size;

          let totalStars = 0;
          const container = document.getElementById('reviewsContainer');

          if (snapshot.empty) {
            container.innerHTML = '<p style="text-align: center; color: var(--text-muted); font-size: 13px;">ไม่มีรีวิวในระบบ</p>';
            document.getElementById('totalStarsCount').textContent = '0';
            return;
          }

          let html = '';
          snapshot.forEach(doc => {
            const r = doc.data();
            totalStars += (r.stars || 5);
            html += `
              <div class="review-card">
                <div class="review-left">
                  <div class="review-author">${r.name}</div>
                  <div class="review-stars">${'★'.repeat(r.stars || 5)}</div>
                  <div class="review-comment">${r.comment}</div>
                  <div class="review-time">${r.time || 'รีวิวเมื่อเร็วๆ นี้'}</div>
                </div>
                <button class="btn-delete" onclick="deleteReview('${doc.id}')">
                  Delete 🗑️
                </button>
              </div>
            `;
          });

          document.getElementById('totalStarsCount').textContent = totalStars;
          container.innerHTML = html;
        });
    }

    async function deleteReview(docId) {
      if (confirm('คุณต้องการลบรีวิวนี้ใช่หรือไม่? 🗑️')) {
        try {
          await db.collection("benefitie_reviews").doc(docId).delete();
        } catch (e) {
          console.error("Error deleting review: ", e);
        }
      }
    }

    function previewImage(input, previewId) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const img = document.getElementById(previewId);
          img.src = e.target.result;
          img.style.display = 'block';
        };
        reader.readAsDataURL(input.files[0]);
      }
    }

    function saveMainProfile() {
      const data = {
        name: document.getElementById('mainName').value,
        bio: document.getElementById('mainBio').value,
        img: document.getElementById('mainImgPreview').src
      };
      localStorage.setItem('benefitie_main_profile', JSON.stringify(data));
      alert('บันทึก Main Page Profile เรียบร้อยแล้วค่ะ ♡');
    }

    function saveContactProfile() {
      const data = {
        name: document.getElementById('contactName').value,
        username: document.getElementById('contactUsername').value,
        bio: document.getElementById('contactBio').value,
        followers: document.getElementById('contactFollowers').value,
        following: document.getElementById('contactFollowing').value,
        img: document.getElementById('contactImgPreview').src
      };
      localStorage.setItem('benefitie_contact_profile', JSON.stringify(data));
      alert('บันทึก Contact Page Profile เรียบร้อยแล้วค่ะ ♡');
    }

    function loadSavedProfiles() {
      const main = JSON.parse(localStorage.getItem('benefitie_main_profile') || '{}');
      if (main.name) document.getElementById('mainName').value = main.name;
      if (main.bio) document.getElementById('mainBio').value = main.bio;
      if (main.img) {
        const img = document.getElementById('mainImgPreview');
        img.src = main.img;
        img.style.display = 'block';
      }

      const contact = JSON.parse(localStorage.getItem('benefitie_contact_profile') || '{}');
      if (contact.name) document.getElementById('contactName').value = contact.name;
      if (contact.username) document.getElementById('contactUsername').value = contact.username;
      if (contact.bio) document.getElementById('contactBio').value = contact.bio;
      if (contact.followers) document.getElementById('contactFollowers').value = contact.followers;
      if (contact.following) document.getElementById('contactFollowing').value = contact.following;
      if (contact.img) {
        const img = document.getElementById('contactImgPreview');
        img.src = contact.img;
        img.style.display = 'block';
      }
    }
  </script>
</body>
</html>
